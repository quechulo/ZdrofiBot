<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>zdrofit registration bot</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8;
    --panel: #ffffff;
    --text: #1c1c1e;
    --muted: #6b6b70;
    --border: #e1e1e4;
    --accent: #2563eb;
    --accent-text: #ffffff;
    --danger: #dc2626;
    --danger-bg: #fee2e2;
    --ok: #16a34a;
    --ok-bg: #dcfce7;
    --warn: #b45309;
    --warn-bg: #fef3c7;
    --neutral-bg: #eceef1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a;
      --panel: #222325;
      --text: #f0f0f1;
      --muted: #9a9aa0;
      --border: #35363a;
      --danger-bg: #3a1a1a;
      --ok-bg: #12301c;
      --warn-bg: #3a2c0f;
      --neutral-bg: #2c2d30;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 { margin: 0 0 4px; font-size: 18px; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  nav {
    display: flex;
    gap: 4px;
    padding: 0 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  nav button {
    border: none;
    background: none;
    padding: 12px 14px;
    font-size: 14px;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  nav button.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  main { max-width: 900px; margin: 0 auto; padding: 20px; }
  section.tab { display: none; }
  section.tab.active { display: block; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .card h2 { margin: 0 0 12px; font-size: 15px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  input[type="text"], input[type="date"], input[type="time"] {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }
  .row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 140px; }
  .session-row { display: flex; gap: 8px; align-items: end; margin-bottom: 8px; }
  .session-row > div { flex: 1; }
  button.btn {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  button.btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.btn.danger { color: var(--danger); }
  button.btn.small { padding: 6px 9px; font-size: 12px; }
  .club-actions { display: flex; justify-content: space-between; margin-top: 8px; }
  .toast {
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 14px;
    white-space: pre-wrap;
  }
  .toast.ok { background: var(--ok-bg); color: var(--ok); }
  .toast.error { background: var(--danger-bg); color: var(--danger); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
  }
  .badge.done { background: var(--ok-bg); color: var(--ok); }
  .badge.pending { background: var(--neutral-bg); color: var(--muted); }
  .badge.waiting-for-login { background: var(--warn-bg); color: var(--warn); }
  .badge.failed, .badge.failed-discovery, .badge.failed-token { background: var(--danger-bg); color: var(--danger); }
  .badge.cancelled { background: var(--neutral-bg); color: var(--muted); }
  pre.log {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    font-size: 12px;
    line-height: 1.5;
    max-height: 480px;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .empty { color: var(--muted); font-size: 13px; padding: 10px 0; }
  .subtle { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>

<header>
  <h1>zdrofit registration bot</h1>
  <p>This controls the bot running on this computer. If a login is needed, it opens in a separate browser window - not here.</p>
</header>

<nav>
  <button data-tab="activities" class="active">Activities</button>
  <button data-tab="status">Status</button>
  <button data-tab="logs">Logs</button>
</nav>

<main>

  <section id="tab-activities" class="tab active">
    <div id="activities-toast"></div>
    <div id="clubs"></div>
    <div class="card">
      <button class="btn" id="add-club">+ Add a club</button>
    </div>
    <div class="card">
      <button class="btn primary" id="save-activities">Save</button>
      <span class="subtle" id="save-hint">Saving reschedules anything new and cancels anything you removed.</span>
    </div>
  </section>

  <section id="tab-status" class="tab">
    <div class="card">
      <h2>Upcoming and recent</h2>
      <div id="status-table"><p class="empty">Loading...</p></div>
    </div>
  </section>

  <section id="tab-logs" class="tab">
    <div class="card">
      <h2>Alerts</h2>
      <pre class="log" id="alerts-log">(none yet)</pre>
    </div>
    <div class="card">
      <h2>Activity log</h2>
      <pre class="log" id="app-log">(none yet)</pre>
    </div>
  </section>

</main>

<script>
(function () {
  "use strict";

  // ---- tab switching ----
  const tabButtons = document.querySelectorAll("nav button");
  const tabs = {
    activities: document.getElementById("tab-activities"),
    status: document.getElementById("tab-status"),
    logs: document.getElementById("tab-logs"),
  };
  tabButtons.forEach((btn) => {
    btn.addEventListener("click", () => {
      tabButtons.forEach((b) => b.classList.remove("active"));
      Object.values(tabs).forEach((t) => t.classList.remove("active"));
      btn.classList.add("active");
      tabs[btn.dataset.tab].classList.add("active");
    });
  });

  // ---- activities editor ----
  // Server/wire format: [{ link, clubSlug, keyword, dates: { 'YYYY-MM-DD': ['HH:MM', ...] }, enabled }]
  // Editor state: same, but each club also gets a flat `sessions` array of
  // {date, time} for simpler add/remove UI - built from `dates` on load,
  // folded back into `dates` on save.
  let clubs = [];

  function activitiesToState(activities) {
    return activities.map((a) => {
      const sessions = [];
      const dates = a.dates || {};
      for (const date of Object.keys(dates)) {
        for (const time of dates[date] || []) {
          sessions.push({ date, time });
        }
      }
      if (sessions.length === 0) sessions.push({ date: "", time: "" });
      return {
        link: a.link || "",
        clubSlug: a.clubSlug || "",
        keyword: a.keyword || "",
        sessions,
      };
    });
  }

  function stateToActivities(state) {
    return state.map((c) => {
      const dates = {};
      for (const s of c.sessions) {
        if (!s.date || !s.time) continue;
        if (!dates[s.date]) dates[s.date] = [];
        if (!dates[s.date].includes(s.time)) dates[s.date].push(s.time);
      }
      return {
        link: c.link.trim(),
        clubSlug: c.clubSlug.trim(),
        keyword: c.keyword.trim(),
        dates,
        enabled: true,
      };
    });
  }

  function renderClubs() {
    const container = document.getElementById("clubs");
    container.innerHTML = "";
    clubs.forEach((club, ci) => {
      const card = document.createElement("div");
      card.className = "card";

      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML =
        '<div><label>Club link (schedule page URL)</label>' +
        '<input type="text" data-field="link" placeholder="https://zdrofit.pl/kluby-fitness/.../grafik-zajec#" value="' +
        escapeHtml(club.link) + '"></div>' +
        '<div><label>Keyword (e.g. pilates)</label>' +
        '<input type="text" data-field="keyword" value="' + escapeHtml(club.keyword) + '"></div>';
      card.appendChild(row);

      const sessionsWrap = document.createElement("div");
      club.sessions.forEach((s, si) => {
        const sr = document.createElement("div");
        sr.className = "session-row";
        sr.innerHTML =
          '<div><label>Date</label><input type="date" data-si="' + si + '" data-field="date" value="' + escapeHtml(s.date) + '"></div>' +
          '<div><label>Time</label><input type="time" data-si="' + si + '" data-field="time" value="' + escapeHtml(s.time) + '"></div>' +
          '<button class="btn small danger" data-remove-session="' + si + '">Remove</button>';
        sessionsWrap.appendChild(sr);
      });
      card.appendChild(sessionsWrap);

      const actions = document.createElement("div");
      actions.className = "club-actions";
      actions.innerHTML =
        '<button class="btn small" data-add-session>+ Add date/time</button>' +
        '<button class="btn small danger" data-remove-club>Remove this club</button>';
      card.appendChild(actions);

      // wire events
      row.querySelectorAll("input").forEach((input) => {
        input.addEventListener("input", () => {
          club[input.dataset.field] = input.value;
        });
      });
      sessionsWrap.querySelectorAll("input").forEach((input) => {
        input.addEventListener("input", () => {
          club.sessions[Number(input.dataset.si)][input.dataset.field] = input.value;
        });
      });
      sessionsWrap.querySelectorAll("[data-remove-session]").forEach((b) => {
        b.addEventListener("click", () => {
          club.sessions.splice(Number(b.dataset.removeSession), 1);
          if (club.sessions.length === 0) club.sessions.push({ date: "", time: "" });
          renderClubs();
        });
      });
      actions.querySelector("[data-add-session]").addEventListener("click", () => {
        club.sessions.push({ date: "", time: "" });
        renderClubs();
      });
      actions.querySelector("[data-remove-club]").addEventListener("click", () => {
        clubs.splice(ci, 1);
        renderClubs();
      });

      container.appendChild(card);
    });

    if (clubs.length === 0) {
      container.innerHTML = '<p class="empty">No clubs yet - add one below.</p>';
    }
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  function showToast(msg, kind) {
    const el = document.getElementById("activities-toast");
    el.innerHTML = '<div class="toast ' + kind + '">' + escapeHtml(msg) + "</div>";
  }

  document.getElementById("add-club").addEventListener("click", () => {
    clubs.push({ link: "", clubSlug: "", keyword: "", sessions: [{ date: "", time: "" }] });
    renderClubs();
  });

  document.getElementById("save-activities").addEventListener("click", async () => {
    const payload = stateToActivities(clubs);
    try {
      const res = await fetch("/api/activities", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (!res.ok) {
        showToast((data.error || "Save failed") + (data.details ? "\\n" + data.details.join("\\n") : ""), "error");
        return;
      }
      showToast("Saved - " + data.added + " new added, " + data.cancelled + " cancelled.", "ok");
      loadStatus();
    } catch (err) {
      showToast("Save failed: " + err.message, "error");
    }
  });

  async function loadActivities() {
    const res = await fetch("/api/activities");
    const data = await res.json();
    clubs = activitiesToState(Array.isArray(data) ? data : []);
    if (clubs.length === 0) {
      clubs.push({ link: "", clubSlug: "", keyword: "", sessions: [{ date: "", time: "" }] });
    }
    renderClubs();
  }

  // ---- status tab ----
  function renderStatus(data) {
    const el = document.getElementById("status-table");
    if (!data.entries || data.entries.length === 0) {
      el.innerHTML = '<p class="empty">Nothing scheduled yet.</p>';
      return;
    }
    let html = "<table><thead><tr><th>When</th><th>Keyword</th><th>Status</th><th>Trigger</th><th>Attempts</th></tr></thead><tbody>";
    for (const e of data.entries) {
      html +=
        "<tr><td>" + escapeHtml(e.targetDatetime || "") + "</td>" +
        "<td>" + escapeHtml(e.keyword || "") + "</td>" +
        '<td><span class="badge ' + escapeHtml(e.status) + '">' + escapeHtml(e.status) + "</span></td>" +
        "<td>" + escapeHtml(formatDate(e.triggerAt)) + "</td>" +
        "<td>" + (e.attempts || 0) + "</td></tr>";
    }
    html += "</tbody></table>";
    el.innerHTML = html;
  }

  function formatDate(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleString();
  }

  async function loadStatus() {
    try {
      const res = await fetch("/api/status");
      const data = await res.json();
      renderStatus(data);
    } catch {
      /* keep last-known table on a transient fetch failure */
    }
  }

  // ---- logs tab ----
  async function loadLogs() {
    try {
      const res = await fetch("/api/logs?tail=300");
      const data = await res.json();
      const appEl = document.getElementById("app-log");
      const alertsEl = document.getElementById("alerts-log");
      appEl.textContent = data.log && data.log.length ? data.log.join("\\n") : "(none yet)";
      alertsEl.textContent = data.alerts && data.alerts.length ? data.alerts.join("\\n") : "(none yet)";
      appEl.scrollTop = appEl.scrollHeight;
    } catch {
      /* keep last-known logs on a transient fetch failure */
    }
  }

  loadActivities();
  loadStatus();
  loadLogs();
  setInterval(loadStatus, 5000);
  setInterval(loadLogs, 5000);
})();
</script>

</body>
</html>
